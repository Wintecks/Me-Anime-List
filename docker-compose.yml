version: '3.8'

services:
  anime-list:
    build: .
    container_name: anime_list
    restart: always
    ports:
      - "8099:80"
  
  backend:
    build:
      context: .
      dockerfile: dockerfile.backend
    container_name: backend
    restart: always
    ports:
      - "2424:2424"
    volumes:
      - ./data:/app/data
<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Me Anime List</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="icom.png">
</head>
<body>
  <script src="script.js"></script>

  <header>
    <h1>Me Anime List:<span id="anime-count" class="count-badge">0</span></h1>
    <div>
      <button class="btn" onclick="openAddModal()">+ Додати аніме</button>
      <button class="btn" onclick="openSettin()">Налаштування</button>
    </div>
  </header>

  <div class="search-container">
    <input type="text" id="search" class="search-input" placeholder="Пошук у списку..." oninput="filterAnime()">
    <select id="search-tegs" class="search-tegs" onchange="filterAnime()">
      <option value="Усі">Усі</option>
      <option value="Переглянув">Переглянув</option>
      <option value="Дивлюся">Дивлюся</option>
      <option value="Закинув">Закинув</option>
      <option value="Нові серії">Нові серії</option>
    </select>
  </div>

  <div class="grid" id="anime-grid">
    <!-- Картки -->
  </div>

  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-heading">Редагувати аніме</h2>
      </div>

      <input type="hidden" id="edit-row-index">

      <div class="form-group">
        <label for="anime-title">Назва аніме</label>
        <input type="text" id="anime-title" class="form-control">
      </div>

      <div class="form-group">
            <label for="anime-status">Статус перегляду</label>
            <select id="anime-status" class="form-control">
              <option value="Переглянув">Переглянув</option>
              <option value="Дивлюся">Дивлюся</option>
              <option value="Закинув">Закинув</option>
              <option value="Нові серії">Нові серії</option>
            </select>
      </div>

      <div class="form-group">
        <label for="anime-url">Посилання (Anitube / Інше)</label>
        <input type="url" id="anime-url" class="form-control">
      </div>

      <div class="form-group">
        <label for="anime-url">Пару слів про аніме</label>
        <textarea name="description" id="anime-desc" rows="3" class="form-control" placeholder=""></textarea>
      </div>

      <div class="modal-actions">
        <div>
          <button class="btn btn-danger" id="delete-btn" onclick="deleteCurrentAnime()">Видалити</button>
        </div>
        <div style="display: flex; gap: 0.5rem;">
          <button class="btn btn-secondary" onclick="closeModal('modal')">Скасувати</button>
          <button class="btn" id="save-btn" onclick="saveAnime()">Зберегти</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-setting">
    <div class="modal">
      <div class="form-group">
        <label for="apps-script">Посилання на Apps Script</label>
        <input type="url" id="apps-script" class="form-control" placeholder="https://script.google.com">
      </div>

      <div style="display: flex; gap: 0.5rem;">
          <button class="btn btn-secondary" onclick="closeModal('modal-setting')">Скасувати</button>
          <button class="btn" id="save-btn" onclick="saveSetting()">Зберегти</button>
        </div>
    </div>
  </div>
</body>
</html>

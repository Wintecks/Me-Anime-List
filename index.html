<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime list</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(22, 31, 48, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #a5b4fc, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .btn:hover { background: var(--accent-hover); transform: translateY(-1px); }
    .btn-danger { background: var(--danger); }
    .btn-danger:hover { background: var(--danger-hover); }
    .btn-secondary { background: #334155; }
    .btn-secondary:hover { background: #475569; }

    .search-container {
      width: 100%;
      max-width: 1200px;
      margin-bottom: 2rem;
    }
    .search-input {
      width: 100%;
      padding: 0.8rem 1.2rem;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: white;
      font-size: 1rem;
      outline: none;
      backdrop-filter: blur(12px);
      transition: border-color 0.2s;
    }
    .search-input:focus {
      border-color: var(--accent);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.2rem;
      width: 100%;
      max-width: 1200px;
    }

    /* Картка аніме */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1.2rem;
      cursor: pointer;
      position: relative;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 110px;
      user-select: none;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(99, 102, 241, 0.5);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(99, 102, 241, 0.1);
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.4;
      color: var(--text);
    }

    .card-footer {
      margin-top: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .card-badge {
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      background: rgba(99, 102, 241, 0.15);
      color: #a5b4fc;
    }

    /* Модальне вікно */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal {
      background: #1e293b;
      border: 1px solid var(--card-border);
      padding: 2rem;
      border-radius: 16px;
      width: 90%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-size: 1.3rem;
      font-weight: 700;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .form-group label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .form-control {
      width: 100%;
      padding: 0.7rem 1rem;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      font-size: 0.95rem;
      outline: none;
    }
    .form-control:focus {
      border-color: var(--accent);
    }

    .modal-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Переглянуті Аніме</h1>
    <button class="btn" onclick="openAddModal()">+ Додати аніме</button>
  </header>

  <div class="search-container">
    <input type="text" id="search" class="search-input" placeholder="Пошук у списку..." oninput="filterAnime()">
  </div>

  <div class="grid" id="anime-grid">
    <!-- Картки генеруються JS -->
  </div>

  <!-- Модальне вікно (Редагування / Додавання) -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-heading">Редагувати аніме</h2>
      </div>

      <input type="hidden" id="edit-row-index">

      <div class="form-group">
        <label for="anime-title">Назва аніме</label>
        <input type="text" id="anime-title" class="form-control" placeholder="Наприклад: Наруто">
      </div>

      <div class="form-group">
        <label for="anime-url">Посилання (Anitube / Інше)</label>
        <input type="url" id="anime-url" class="form-control" placeholder="https://anitube.in.ua/...">
      </div>

      <div class="modal-actions">
        <div>
          <button class="btn btn-danger" id="delete-btn" onclick="deleteCurrentAnime()">Видалити</button>
        </div>
        <div style="display: flex; gap: 0.5rem;">
          <button class="btn btn-secondary" onclick="closeModal()">Скасувати</button>
          <button class="btn" onclick="saveAnime()">Зберегти</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxa7nwBMJrCxkEDuv-R7wqE5fmgKM-3Ju8K8L3ky3kgmTGjSg4ausZYMC2sQhKoGuuZ/exec'; // Встав сюди своє посилання на Apps Script
    let animeList = [];
    let isEditMode = false;

    // 1. Завантаження даних з Google Таблиці
    async function loadAnime() {
      try {
        const response = await fetch(SCRIPT_URL);
        animeList = await response.json();
        renderList(animeList);
      } catch (err) {
        console.error("Помилка при завантаженні:", err);
      }
    }

    // 2. Рендеринг списку картка
    function renderList(list) {
      const grid = document.getElementById('anime-grid');
      grid.innerHTML = '';

      list.forEach(anime => {
        const card = document.createElement('div');
        card.className = 'card';
        
        const hasUrl = anime.url && anime.url.trim() !== '';

        card.innerHTML = `
          <div class="card-title">${anime.title}</div>
          <div class="card-footer">
            ${hasUrl ? '<span class="card-badge">Anitube</span>' : '<span></span>'}
          </div>
        `;

        // Обробка кліку на картку
        card.addEventListener('click', (e) => {
          // Якщо натиснуто з клавішею Ctrl (або Cmd на Mac) і є посилання — відкриваємо посилання
          if ((e.ctrlKey || e.metaKey) && hasUrl) {
            window.open(anime.url, '_blank');
          } else {
            // Звичайний клік відкриває вікно редагування
            openEditModal(anime);
          }
        });

        // Підтримка відкриття посилання за допомогою кліку колесиком миші (Middle Click)
        card.addEventListener('auxclick', (e) => {
          if (e.button === 1 && hasUrl) {
            e.preventDefault();
            window.open(anime.url, '_blank');
          }
        });

        grid.appendChild(card);
      });
    }

    // 3. Пошук
    function filterAnime() {
      const query = document.getElementById('search').value.toLowerCase();
      const filtered = animeList.filter(a => a.title.toLowerCase().includes(query));
      renderList(filtered);
    }

    // 4. Відкриття модалки для Додавання
    function openAddModal() {
      isEditMode = false;
      document.getElementById('modal-heading').innerText = "Додати нове аніме";
      document.getElementById('edit-row-index').value = '';
      document.getElementById('anime-title').value = '';
      document.getElementById('anime-url').value = '';
      document.getElementById('delete-btn').style.display = 'none';
      document.getElementById('modal').style.display = 'flex';
    }

    // 5. Відкриття модалки для Редагування
    function openEditModal(anime) {
      isEditMode = true;
      document.getElementById('modal-heading').innerText = "Налаштування елемента";
      document.getElementById('edit-row-index').value = anime.rowIndex;
      document.getElementById('anime-title').value = anime.title;
      document.getElementById('anime-url').value = anime.url || '';
      document.getElementById('delete-btn').style.display = 'block';
      document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }

    // 6. Збереження (Add / Edit)
    async function saveAnime() {
      const title = document.getElementById('anime-title').value.trim();
      const url = document.getElementById('anime-url').value.trim();
      const rowIndex = document.getElementById('edit-row-index').value;

      if (!title) return alert("Введіть назву!");

      const payload = {
        action: isEditMode ? 'edit' : 'add',
        title,
        url,
        rowIndex
      };

      closeModal();

      await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      });

      loadAnime();
    }

    // 7. Видалення
    async function deleteCurrentAnime() {
      const rowIndex = document.getElementById('edit-row-index').value;
      const title = document.getElementById('anime-title').value;

      if (!confirm(`Видалити "${title}"?`)) return;

      closeModal();

      await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'delete', rowIndex })
      });

      loadAnime();
    }

    loadAnime();
  </script>
</body>
</html>
